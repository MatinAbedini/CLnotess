{% load thumbnail %}

<div class="col-lg-3 col-md-3 col-sm-4 col-xs-12">
    <div class="panel panel-default card-view">
        <div class="panel-wrapper collapse in">
            <div class="row">
                <div class="user-profile text-center">
                    {% thumbnail user.profile_image "80x80" crop="center" as im %}
                        <img src="{{ im.url }}" alt="profile_image" class="user-auth-img img-circle">
                    {% endthumbnail %}
                </div>
            </div>
            <hr class="light-grey-hr mt-20 mb-20">
            <div class="row">
                <div class="file-manager">
                    <ul class="folder-list mb-2">
                        <li class="{% if request.resolver_match.url_name == "edit-account-page" %} active {% endif %}">
                            <a href="{% url "edit-account-page" %}"><i class="
                                bi
                                {% if request.resolver_match.url_name == "edit-account-page" %}
                                    bi-circle-fill
                                {% else %}
                                    bi-circle
                                {% endif %}"></i>

                            ویرایش حساب کاربری</a>
                        </li>
                        {% comment %} <li class="{% if request.resolver_match.url_name == "change-email-page" %} active {% endif %}">
                            <a href="{% url "change-email-page" %}"><i class="
                                bi
                                {% if request.resolver_match.url_name == "change-email-page" %}
                                    bi-circle-fill
                                {% else %}
                                    bi-circle
                                {% endif %}"></i>

                            تغییر ایمیل</a>
                        </li> {% endcomment %}
                        <li class="{% if request.resolver_match.url_name == "change-password-page" %} active {% endif %}">
                            <a href="{% url "change-password-page" %}"><i class="
                                bi
                                {% if request.resolver_match.url_name == "change-password-page" %}
                                    bi-circle-fill
                                {% else %}
                                    bi-circle
                                {% endif %}"></i>

                            تغییر رمز عبور</a>
                        </li>
                        <li class="{% if request.resolver_match.url_name == "appearance-settings-page" %} active {% endif %}">
                            <a href="{% url "appearance-settings-page" %}"><i class="
                                bi
                                {% if request.resolver_match.url_name == "appearance-settings-page" %}
                                    bi-circle-fill
                                {% else %}
                                    bi-circle
                                {% endif %}"></i>

                            تنظیمات ظاهری</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
