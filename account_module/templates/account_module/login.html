{% load static %}

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>CLnotess | ورود به حساب کاربری</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="description" content="CLnotess is a web application for managing classes." />
        <meta name="keywords" content="CLnotess, class, school, class managing, school managing, Login" />
        <meta name="author" content="Matin Abedini"/>

        <link rel="shortcut icon" href="favicon.ico">
        <link rel="icon" href="favicon.ico" type="image/x-icon">

		<link href="{% static "vendors/bower_components/jasny-bootstrap/dist/css/jasny-bootstrap.min.css" %}" rel="stylesheet" type="text/css"/>
		<link href="{% static "dist/css/style.css" %}" rel="stylesheet" type="text/css">
	</head>
	<body>
		<div class="wrapper pa-0">
			<header class="sp-header">
				<div class="sp-logo-wrap pull-left">
					<a href="{% url "index-page" %}">
						<img class="brand-img mr-10" src="{% static "img/logo.png" %}" alt="brand"/>
						<span class="brand-text txt-dark">CLnotess</span>
					</a>
				</div>
				<div class="form-group mb-0 pull-right">
					<span class="inline-block pr-10">حساب کاربری ندارید؟</span>
					<a class="inline-block btn btn-primary  btn-rounded" href="{% url "register-page" %}">ثبت نام کنید</a>
				</div>
				<div class="clearfix"></div>
			</header>
			<div class="page-wrapper pa-0 ma-0">
				<div class="container-fluid">
					<div class="table-struct full-width full-height">
						<div class="table-cell vertical-align-middle auth-form-wrap">
							<div class="auth-form  ml-auto mr-auto no-float card-view pt-30 pb-30">
								<div class="row">
									<div class="col-sm-12 col-xs-12">
										<div class="mb-30">
											<h3 class="text-center txt-dark mb-10">!خوش آمدید</h3>
											<h6 class="text-center nonecase-font txt-grey">مشخصات خود را در زیر وارد کنید</h6>
										</div>
										<div class="form-wrap">
											<form method="post">

                                                {% csrf_token %}

												<div class="form-group">
													<label class="control-label mb-10 pull-right" for="exampleInputEmail_2">نام کاربری</label>
                                                    {{ form.username }}
                                                </div>
												<div class="form-group">
													<label class="pull-right control-label mb-10" for="exampleInputpwd_2">رمز عبور</label>
													<a class="capitalize-font txt-primary block mb-10 pull-left font-12" href="forgot-password.html">رمز عبور را فراموش کرده اید؟</a>
													<div class="clearfix"></div>
                                                    {{ form.password }}
                                                </div>

												<div class="form-group pull-right">
                                                    {{ form.captcha }}
                                                </div>

												<div class="clearfix"></div>
												<div class="form-group text-center">
                                                    <input type="submit" value="وارد شوید" class="btn btn-primary btn-block btn-rounded">
												</div>
                                            </form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- jQuery -->
		<script src="{% static "vendors/bower_components/jquery/dist/jquery.min.js" %}"></script>
		<!-- Bootstrap Core JavaScript -->
		<script src="{% static "vendors/bower_components/bootstrap/dist/js/bootstrap.min.js" %}"></script>
		<script src="{% static "vendors/bower_components/jasny-bootstrap/dist/js/jasny-bootstrap.min.js" %}"></script>
		<!-- Slimscroll JavaScript -->
		<script src="{% static "dist/js/jquery.slimscroll.js" %}"></script>
		<!-- Init JavaScript -->
		<script src="{% static "dist/js/init.js" %}"></script>
	</body>
</html>
