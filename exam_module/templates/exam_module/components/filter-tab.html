<div class="col-lg-3 col-md-4 col-sm-5 col-xs-12">
    <div class="panel panel-default card-view">
        <div class="panel-wrapper collapse in">
            <div class="row">
                <div class="mt-20 mb-20 ml-15 mr-15">
                    <a href="{% url "create-exam-page" %}" class="btn btn-success btn-block">
                    اضافه کردن امتحان
                    </a>
                </div>
            </div>
            <div class="row">
                <ul class="inbox-nav">
                    <ul>
                        <li>
                            <a href="javascript:void(0);" data-toggle="collapse" data-target="#dashboard_dr" style="font-size: 18px; font-weight: 500;">
                                وضعیت
                                <div class="pull-left"><i class="zmdi zmdi-caret-down"></i></div><div class="clearfix"></div></a>
                                <ul id="dashboard_dr" class="collapse collapse-level-1  ml-25" style="font-size: 15.30px; font-weight: 500;">
                                <li>
                                    <div class="checkbox checkbox-success checkbox-circle">
                                        <input id="done" type="checkbox" {% if "1" in status_filter %} checked {% endif %}>
                                        <label for="done"> انجام شده </label>
                                    </div>
                                </li>
                                <li>
                                    <div class="checkbox checkbox-warning checkbox-circle">
                                        <input id="in_progress" type="checkbox" {% if "2" in status_filter %} checked {% endif %}>
                                        <label for="in_progress"> درحال انجام </label>
                                    </div>
                                </li>
                                <li>
                                    <div class="checkbox checkbox-danger checkbox-circle">
                                        <input id="not_done" type="checkbox" {% if "3" in status_filter %} checked {% endif %}>
                                        <label for="not_done"> انجام نشده </label>
                                    </div>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <ul>
                        <li>
                            <a href="javascript:void(0);" data-toggle="collapse" data-target="#ecom_dr" style="font-size: 18px; font-weight: 500;">
                                سختی
                                <div class="pull-left"><i class="zmdi zmdi-caret-down"></i></div><div class="clearfix"></div></a>
                                <ul id="ecom_dr" class="collapse collapse-level-1  ml-25" style="font-size: 15.30px; font-weight: 500;">
                                <li>
                                    <div class="checkbox checkbox-success checkbox-circle">
                                        <input id="easy" type="checkbox" {% if "1" in difficulty_filter %} checked {% endif %}>
                                        <label for="easy"> ساده </label>
                                    </div>
                                </li>
                                <li>
                                    <div class="checkbox checkbox-warning checkbox-circle">
                                        <input id="average" type="checkbox" {% if "2" in difficulty_filter %} checked {% endif %}>
                                        <label for="average"> متوسط </label>
                                    </div>
                                </li>
                                <li>
                                    <div class="checkbox checkbox-danger checkbox-circle">
                                        <input id="hard" type="checkbox" {% if "3" in difficulty_filter %} checked {% endif %}>
                                        <label for="hard"> سخت </label>
                                    </div>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <ul>
                        <li>
                            <a href="javascript:void(0);" data-toggle="collapse" data-target="#app_dr" style="font-size: 18px; font-weight: normal;">
                                درس
                                <div class="pull-left"><i class="zmdi zmdi-caret-down"></i></div><div class="clearfix"></div></a>
                            <ul id="app_dr" class="collapse collapse-level-1 ml-25" style="font-size: 15.30px;">
                                <li>
                                    {% for lesson in lessons %}
                                        <div class="checkbox checkbox-primary checkbox-circle">
                                            <input id="{{ lesson }}" type="checkbox" {% if lesson in lesson_filter %} checked {% endif %}>
                                            <label for="{{ lesson }}"> {{ lesson }} </label>
                                        </div>
                                    {% endfor %}
                                </li>
                            </ul>
                        </li>
                    </ul>
                </ul>
            </div>
            <div class="row">
                <div class="mt-20 mb-20 ml-30 mr-30">
                    <form action="" method="get" id="filter_form">
                        <input type="hidden" name="page" id="page" value="{{ page_obj.number }}">
                        <input type="hidden" name="difficulty" id="difficulty" value="{{ difficulty_filter }}">
                        <input type="hidden" name="status" id="status" value="{{ status_filter }}">
                        <input type="hidden" name="lesson" id="lesson" value="{{ lesson_filter }}">
                    </form>
                    <button class="btn btn-primary btn-rounded btn-outline btn-block" onclick="filterExams({{ lessons }})">فیلتر</button>
                </div>
            </div>
        </div>
    </div>
</div>
